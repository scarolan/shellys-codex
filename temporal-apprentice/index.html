<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>The Temporal Apprentice — A Time-Travelling Adventure</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Courier+Prime&display=swap" rel="stylesheet">
    <script>(function(){var h=document.documentElement,t=localStorage.getItem('shellys-codex-theme'),f=localStorage.getItem('shellys-codex-font');if(t==='light')h.classList.add('light-theme');if(f==='small')h.classList.add('font-sm');else if(f==='large')h.classList.add('font-lg');})();</script>
    <script src="jquery.min.js"></script>
    <script src="ie.js" nomodule></script>
    <script>
        parchment_options = {
            lib_path: './',
            default_story: ['./temporal_apprentice.z8'],
        };
    </script>
    <script src="web.js" type="module"></script>
    <link rel="stylesheet" href="web.css">
    <style>
        /* === VICTORIAN BRASS & SEPIA THEME ===
           Rule: only override colors, fonts, and cosmetics.
           Let Parchment handle all layout/sizing. */

        :root {
            --game-body-bg: #1a1008;
            --game-port-bg: #0f0d08;
            --game-border: #c4943a;
            --game-shadow: 0 0 20px rgba(196, 148, 58, 0.2), 0 0 60px rgba(196, 148, 58, 0.05), inset 0 0 60px rgba(0, 0, 0, 0.5);
            --game-overlay-bg: radial-gradient(ellipse at center, transparent 65%, rgba(0, 0, 0, 0.35) 100%);
            --game-grid-bg: #1a1206;
            --game-grid-color: #c4943a;
            --game-grid-border: #6b5020;
            --game-gridline-bg: #1a1206;
            --game-buffer-bg: #0f0d08;
            --game-buffer-color: #d4b896;
            --game-header-color: #e8c868;
            --game-subheader-color: #d4b060;
            --game-emphasized-color: #d4a848;
            --game-alert-color: #cc6644;
            --game-note-color: #8a7040;
            --game-input-color: #e8c060;
            --game-loading-color: #d4b896;
            --game-scrollbar-track: #0f0d08;
            --game-scrollbar-thumb: #6b5020;
            --game-scrollbar-hover: #c4943a;
            --game-font-size: 18px;
            --game-font-size-status: 18px;
        }

        html.font-sm {
            --game-font-size: 15px;
            --game-font-size-status: 15px;
        }
        html.font-lg {
            --game-font-size: 22px;
            --game-font-size-status: 22px;
        }

        html.light-theme {
            --game-body-bg: #f5efe6;
            --game-port-bg: #fdf9f3;
            --game-border: #b8882e;
            --game-shadow: 0 2px 12px rgba(0, 0, 0, 0.1), 0 0 0 1px rgba(184, 136, 46, 0.2);
            --game-overlay-bg: none;
            --game-grid-bg: #d2c0a0;
            --game-grid-color: #3a2810;
            --game-grid-border: #b8a480;
            --game-gridline-bg: #d2c0a0;
            --game-buffer-bg: #fdf9f3;
            --game-buffer-color: #3d2e18;
            --game-header-color: #4a3010;
            --game-subheader-color: #5a3e18;
            --game-emphasized-color: #6a4820;
            --game-alert-color: #b83820;
            --game-note-color: #7a6840;
            --game-input-color: #7a5a20;
            --game-loading-color: #3d2e18;
            --game-scrollbar-track: #f5efe6;
            --game-scrollbar-thumb: #c8b898;
            --game-scrollbar-hover: #b8882e;
        }

        body {
            background: var(--game-body-bg) !important;
            transition: background 0.3s;
        }

        /* Brass-rimmed terminal frame */
        #gameport {
            background: var(--game-port-bg) !important;
            border: 2px solid var(--game-border) !important;
            border-radius: 12px !important;
            box-shadow: var(--game-shadow) !important;
            max-width: 960px !important;
            margin: 3vh auto !important;
            position: relative !important;
            transition: background 0.3s, border-color 0.3s, box-shadow 0.3s;
        }

        /* Aged paper overlay */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 12px;
            pointer-events: none;
            z-index: 9999;
            background: var(--game-overlay-bg);
            transition: background 0.3s;
        }

        /* Status bar — dark brass */
        .GridWindow {
            background: var(--game-grid-bg) !important;
            color: var(--game-grid-color) !important;
            font-family: 'Special Elite', 'Courier New', monospace !important;
            font-size: var(--game-font-size-status) !important;
            border-bottom: 1px solid var(--game-grid-border) !important;
            transition: background 0.3s, color 0.3s, border-color 0.3s;
        }

        /* Extend status bar background full-width for proportional font */
        .GridWindow .GridLine {
            display: block !important;
            width: 100% !important;
            background: var(--game-gridline-bg) !important;
            padding: 6px 0 !important;
            line-height: 1.4 !important;
            transition: background 0.3s;
        }

        .GridWindow span, .GridLine span {
            color: var(--game-grid-color) !important;
            background: transparent !important;
            transition: color 0.3s;
        }

        /* Main text area — warm sepia */
        .BufferWindow {
            background: var(--game-buffer-bg) !important;
            color: var(--game-buffer-color) !important;
            font-family: 'Special Elite', 'Courier New', monospace !important;
            font-size: var(--game-font-size) !important;
            line-height: 1.5 !important;
            overflow-x: hidden !important;
            transition: background 0.3s, color 0.3s;
        }

        .BufferWindowInner {
            max-width: none !important;
        }

        .BufferLine, .BufferLine span {
            color: var(--game-buffer-color) !important;
            transition: color 0.3s;
        }

        /* Text style overrides */
        .Style_header, .BufferLine .Style_header { color: var(--game-header-color) !important; font-weight: bold !important; }
        .Style_subheader, .BufferLine .Style_subheader { color: var(--game-subheader-color) !important; }
        .Style_emphasized, .BufferLine .Style_emphasized { color: var(--game-emphasized-color) !important; font-style: italic !important; }
        .Style_alert, .BufferLine .Style_alert { color: var(--game-alert-color) !important; }
        .Style_note, .BufferLine .Style_note { color: var(--game-note-color) !important; }
        .Style_input, .BufferLine .Style_input { color: var(--game-input-color) !important; }

        /* Input field — bright amber */
        .LineInput {
            color: var(--game-input-color) !important;
            font-family: 'Special Elite', 'Courier New', monospace !important;
            font-size: var(--game-font-size) !important;
            caret-color: var(--game-input-color) !important;
            background: transparent !important;
            border: none !important;
            outline: none !important;
            transition: color 0.3s;
        }

        /* Loading pane */
        #loadingpane {
            color: var(--game-loading-color);
            font-family: 'Special Elite', 'Courier New', monospace;
            font-size: var(--game-font-size);
            transition: color 0.3s;
        }

        /* Scrollbar */
        .BufferWindow::-webkit-scrollbar { width: 6px; }
        .BufferWindow::-webkit-scrollbar-track { background: var(--game-scrollbar-track); }
        .BufferWindow::-webkit-scrollbar-thumb { background: var(--game-scrollbar-thumb); border-radius: 3px; }
        .BufferWindow::-webkit-scrollbar-thumb:hover { background: var(--game-scrollbar-hover); }

        /* Hide Parchment chrome */
        #about, #footer { display: none !important; }

        /* Control buttons (shared style) */
        .game-control {
            position: absolute;
            top: 10px;
            z-index: 10000;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--game-border);
            background: var(--game-port-bg);
            color: var(--game-grid-color);
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s, background 0.3s, border-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }
        .game-control:hover { opacity: 1; }

        /* Theme toggle */
        #theme-toggle { right: 10px; }
        #theme-toggle .icon-sun,
        #theme-toggle .icon-moon { width: 18px; height: 18px; }
        #theme-toggle .icon-sun { display: none; }
        html.light-theme #theme-toggle .icon-sun { display: block; }
        html.light-theme #theme-toggle .icon-moon { display: none; }

        /* Font size toggle */
        #font-toggle {
            right: 48px;
            font-family: 'Special Elite', monospace;
            font-weight: bold;
            font-size: 14px;
            line-height: 1;
        }
        html.font-sm #font-toggle { font-size: 11px; }
        html.font-lg #font-toggle { font-size: 17px; }
    </style>
</head>
<body>
    <div id="gameport">
        <button id="font-toggle" class="game-control" title="Font size: medium" aria-label="Cycle font size">A</button>
        <button id="theme-toggle" class="game-control" title="Toggle light/dark theme" aria-label="Toggle theme">
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <div id="crt-overlay"></div>
        <div id="windowport"></div>
        <div id="loadingpane">
            <img src="waiting.gif" alt="LOADING"><br>
            <em>&nbsp;&nbsp;&nbsp;Loading...</em>
        </div>
        <div id="errorpane" style="display:none;"><div id="errorcontent">...</div></div>
    </div>
    <script>
        (function() {
            var html = document.documentElement;

            // Theme toggle
            document.getElementById('theme-toggle').addEventListener('click', function() {
                html.classList.toggle('light-theme');
                localStorage.setItem('shellys-codex-theme', html.classList.contains('light-theme') ? 'light' : 'dark');
            });

            // Font size toggle
            var sizes = ['medium', 'large', 'small'];
            var classes = { small: 'font-sm', large: 'font-lg' };
            var fontBtn = document.getElementById('font-toggle');

            function currentSize() {
                if (html.classList.contains('font-sm')) return 'small';
                if (html.classList.contains('font-lg')) return 'large';
                return 'medium';
            }

            fontBtn.title = 'Font size: ' + currentSize();

            fontBtn.addEventListener('click', function() {
                var cur = currentSize();
                var next = sizes[(sizes.indexOf(cur) + 1) % sizes.length];
                html.classList.remove('font-sm', 'font-lg');
                if (classes[next]) html.classList.add(classes[next]);
                localStorage.setItem('shellys-codex-font', next);
                fontBtn.title = 'Font size: ' + next;
            });
        })();
    </script>
</body>
</html>
