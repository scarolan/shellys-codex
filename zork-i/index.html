<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Zork I — The Great Underground Empire</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
    <link rel="icon" href="../favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Short+Stack&display=swap" rel="stylesheet">
    <script src="jquery.min.js"></script>
    <script src="ie.js" nomodule></script>
    <script>
        parchment_options = {
            lib_path: './',
            default_story: ['./zork1.z3'],
        };
    </script>
    <script src="web.js" type="module"></script>
    <link rel="stylesheet" href="web.css">
    <style>
        /* === DUNGEON PARCHMENT THEME ===
           Aged parchment and torchlight for the Great Underground Empire.
           Rule: only override colors, fonts, and cosmetics.
           Let Parchment handle all layout/sizing. */

        body {
            background: #1a1008 !important;
        }

        /* Worn leather border on the gameport */
        #gameport {
            background: #120e08 !important;
            border: 2px solid #6b4c2a !important;
            border-radius: 8px !important;
            box-shadow:
                0 0 30px rgba(180, 120, 50, 0.15),
                0 0 80px rgba(0, 0, 0, 0.4),
                inset 0 0 60px rgba(0, 0, 0, 0.5) !important;
            max-width: 960px !important;
            margin: 3vh auto !important;
            position: relative !important;
        }

        /* Subtle parchment grain overlay */
        #crt-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 8px;
            pointer-events: none;
            z-index: 9999;
            background:
                radial-gradient(
                    ellipse at center,
                    transparent 60%,
                    rgba(0, 0, 0, 0.4) 100%
                );
        }

        /* Status bar — dungeon stone */
        .GridWindow {
            background: #2a1f12 !important;
            color: #c8a96e !important;
            font-family: 'MedievalSharp', 'Courier New', cursive !important;
            font-size: 22px !important;
            border-bottom: 1px solid #4a3520 !important;
        }

        .GridWindow span, .GridLine, .GridLine span {
            color: #c8a96e !important;
        }

        /* Main text area — adventure journal */
        .BufferWindow {
            background: #120e08 !important;
            color: #c4a46a !important;
            font-family: 'Short Stack', 'Courier New', cursive !important;
            font-size: 20px !important;
            line-height: 1.7 !important;
            overflow-x: hidden !important;
        }

        .BufferWindowInner {
            max-width: none !important;
        }

        .BufferLine, .BufferLine span {
            color: #c4a46a !important;
        }

        /* Text style overrides — torchlight palette */
        .Style_header, .BufferLine .Style_header { color: #e8c868 !important; font-weight: bold !important; }
        .Style_subheader, .BufferLine .Style_subheader { color: #d4b060 !important; }
        .Style_emphasized, .BufferLine .Style_emphasized { color: #d4a848 !important; font-style: italic !important; }
        .Style_alert, .BufferLine .Style_alert { color: #cc6644 !important; }
        .Style_note, .BufferLine .Style_note { color: #8a7040 !important; }
        .Style_input, .BufferLine .Style_input { color: #e8d090 !important; }

        /* Input field — bright torchlight */
        .LineInput {
            color: #e8d090 !important;
            font-family: 'Short Stack', 'Courier New', cursive !important;
            font-size: 22px !important;
            caret-color: #e8d090 !important;
            background: transparent !important;
            border: none !important;
            outline: none !important;
        }

        /* Loading pane */
        #loadingpane {
            color: #c4a46a;
            font-family: 'Short Stack', 'Courier New', cursive;
            font-size: 22px;
        }

        /* Scrollbar */
        .BufferWindow::-webkit-scrollbar { width: 6px; }
        .BufferWindow::-webkit-scrollbar-track { background: #120e08; }
        .BufferWindow::-webkit-scrollbar-thumb { background: #4a3520; border-radius: 3px; }
        .BufferWindow::-webkit-scrollbar-thumb:hover { background: #6b4c2a; }

        /* Hide Parchment chrome */
        #about, #footer { display: none !important; }
    </style>
</head>
<body>
    <div id="gameport">
        <div id="crt-overlay"></div>
        <div id="windowport"></div>
        <div id="loadingpane">
            <img src="waiting.gif" alt="LOADING"><br>
            <em>&nbsp;&nbsp;&nbsp;Loading...</em>
        </div>
        <div id="errorpane" style="display:none;"><div id="errorcontent">...</div></div>
    </div>
</body>
</html>
